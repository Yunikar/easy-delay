name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows-vst3:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Fetch JUCE and CMake
        shell: pwsh
        run: ./tools/fetch-deps.ps1

      - name: Configure
        shell: pwsh
        run: |
          $cmake = "third_party\cmake-src\cmake-3.31.6-windows-x86_64\bin\cmake.exe"
          & $cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build VST3
        shell: pwsh
        run: |
          $cmake = "third_party\cmake-src\cmake-3.31.6-windows-x86_64\bin\cmake.exe"
          & $cmake --build build --config Release --target EasyDelay_VST3

      - name: Validate with the host loader
        shell: pwsh
        run: |
          $cmake = "third_party\cmake-src\cmake-3.31.6-windows-x86_64\bin\cmake.exe"
          & $cmake --build build --config Release --target EasyDelayCheck
          & "build\tools\PluginCheck\EasyDelayCheck_artefacts\Release\EasyDelayCheck.exe"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: EasyDelay-vst3-win64
          path: build/EasyDelay_artefacts/Release/VST3/EasyDelay.vst3
